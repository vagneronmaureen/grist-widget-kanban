<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban DSFR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden;
         background: var(--background-alt-grey, #f6f6f6); color: var(--text-default-grey, #3a3a3a); }
  .kb-bar { display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem; background: #fff;
            border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-bar .kb-title { font-weight: 700; font-size: 1rem; color: var(--text-title-grey, #161616); margin: 0; }
  .kb-bar .kb-spacer { flex: 1; }
  .kb-bar input[type=search] { max-width: 260px; }
  .kb-board { flex: 1; overflow: auto; display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }
  .kb-empty { margin: auto; text-align: center; padding: 2rem; }

  .kb-col { flex: 0 0 290px; max-height: 100%; display: flex; flex-direction: column; border-radius: 4px;
            background: var(--col-bg); border-top: 4px solid var(--col-bar); position: relative; }
  .kb-col-head { display: flex; align-items: center; gap: .5rem; padding: .625rem .75rem; }
  .kb-col-body { padding-bottom: .75rem !important; }
  .kb-modal-head input.fr-input { font-size: 1.125rem; font-weight: 700; flex: 1; }
  .kb-col-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 color: var(--text-title-grey, #161616); }
  .kb-count { background: #fff; border-radius: 1rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700; line-height: 1.5rem; }
  .kb-col-body { padding: 0 .5rem .5rem; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; min-height: 3rem; flex: 1; }
  .kb-col-body.drag-over { outline: 2px dashed var(--col-bar); outline-offset: -4px; border-radius: 4px; }

  .kb-card { background: #fff; border-radius: 4px; padding: .75rem; cursor: grab;
             box-shadow: 0 0 0 1px var(--border-default-grey, #ddd); }
  .kb-card:hover { box-shadow: 0 0 0 1px var(--text-action-high-blue-france, #000091), 0 2px 6px rgba(0,0,0,.12); }
  .kb-card.dragging { opacity: .4; }
  .kb-card-title { margin: 0 0 .25rem; font-size: 1rem; line-height: 1.4; font-weight: 700; color: var(--text-title-grey, #161616); }
  .kb-fields { display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; font-size: .875rem; }
  .kb-f { display: block; }
  .kb-f-label { color: var(--text-mention-grey, #666); font-size: .75rem; line-height: 1.25rem; }
  .kb-f-val { line-height: 1.5rem; }
  .kb-link { word-break: break-all; }
  .kb-num { text-align: right; }
  .kb-badges { display: flex; flex-wrap: wrap; gap: .25rem; }
  .kb-badge { display: inline-block; border-radius: .25rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700;
              line-height: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }

  .kb-overlay { position: fixed; inset: 0; background: rgba(22,22,22,.64); z-index: 50; display: none;
                align-items: center; justify-content: center; padding: 1rem; }
  .kb-overlay.open { display: flex; }
  .kb-modal { background: #fff; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 4px; }
  .kb-modal-head { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-modal-head h2 { margin: 0; flex: 1; font-size: 1.25rem; }
  .kb-modal-head { align-items: center; }
  .kb-modal-body { padding: 1rem 1.5rem; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; align-content: start; flex: 1; }
  .kb-modal-body .fr-input-group { margin-bottom: 1rem; }
  .kb-modal-body .kb-full { grid-column: 1 / -1; }
  .kb-modal-foot { padding: 1rem 1.5rem; border-top: 1px solid var(--border-default-grey, #ddd); display: flex; justify-content: flex-end; gap: .75rem; }
  .kb-checks { display: flex; flex-wrap: wrap; gap: .25rem 1rem; max-height: 9rem; overflow-y: auto; }
  .kb-checks label { display: flex; gap: .375rem; align-items: center; font-size: .875rem; }

  .kb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #fff; z-index: 40;
               box-shadow: -4px 0 16px rgba(0,0,0,.2); transform: translateX(105%); transition: transform .2s; overflow-y: auto; }
  .kb-drawer.open { transform: none; }
  .kb-drawer section { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-drawer h3 { font-size: .9375rem; margin: 0 0 .75rem; }
  .kb-row { display: flex; gap: .375rem; align-items: center; margin-bottom: .375rem; }
  .kb-row .kb-row-name { flex: 1; font-size: .875rem; overflow: hidden; text-overflow: ellipsis; }
  .kb-row select { width: auto; }
  .kb-row { border-radius: 4px; padding: .125rem .25rem; background: #fff; }
  .kb-grip { cursor: grab; font-size: 1.25rem; line-height: 1; color: var(--text-mention-grey, #666); padding: 0 .25rem; user-select: none; }
  .kb-row:hover .kb-grip { color: var(--text-action-high-blue-france, #000091); }
  .row-dragging { opacity: .4; }
  .drop-before { box-shadow: 0 -3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-after { box-shadow: 0 3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-left { box-shadow: -3px 0 0 var(--text-action-high-blue-france, #000091); }
  .drop-right { box-shadow: 3px 0 0 var(--text-action-high-blue-france, #000091); }

  /* popup : mise en page */
  .kb-heading { margin: .5rem 0 .75rem; font-size: 1.125rem; line-height: 1.5; color: var(--text-title-grey, #161616); }
  .kb-divider { border: 0; border-top: 1px solid var(--border-default-grey, #ddd); margin: .5rem 0 1rem; padding: 0; }
  .kb-section { margin-bottom: 1rem; }
  .kb-sec-title { margin: 0 0 .5rem; font-size: 1rem; line-height: 1.5rem; }
  .kb-sec-toggle { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 0 0 .5rem;
                   font: inherit; font-weight: 700; font-size: 1.0625rem; color: var(--text-title-grey, #161616); }
  .kb-chev { display: inline-block; width: 1.25rem; color: var(--text-action-high-blue-france, #000091); }
  .kb-sec-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; padding: 1rem 1rem 0; border-radius: 4px; background: rgba(0, 0, 145, .05); }
  .kb-section.kb-collapsed .kb-sec-body { display: none; }
  .kb-sec-body .kb-full { grid-column: 1 / -1; }
  .kb-sec-input, .kb-heading-input { font-weight: 700; margin-bottom: .5rem; }
  .kb-blk { border: 1px dashed transparent; border-radius: 4px; padding: .25rem .375rem 0; margin-bottom: .25rem; }
  .kb-blk:hover { border-color: var(--border-default-grey, #bbb); }
  /* en mode mise en page, le contenu des champs ne capte pas la souris : le bloc entier reste une cible de dépôt (les champs désactivés n'émettent pas d'événements de glisser) */
  .kb-blk:not(.kb-section) > :not(.kb-blk-bar):not(.kb-heading-input) { pointer-events: none; }
  .kb-blk-bar { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: var(--text-mention-grey, #666); margin-bottom: .25rem; }
  .kb-blk-kind { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-mini { background: #fff; border: 1px solid var(--border-default-grey, #ccc); border-radius: 3px; font-size: .75rem; padding: 0 .5rem; cursor: pointer; line-height: 1.375rem; }
  .kb-mini:hover { border-color: var(--text-action-high-blue-france, #000091); }
  .kb-dropzone { border: 1px dashed var(--border-default-grey, #bbb); border-radius: 4px; color: var(--text-mention-grey, #888);
                 font-size: .8125rem; text-align: center; padding: .375rem; margin: .25rem 0 .75rem; }
  .kb-dropzone.drop-over, .kb-blk.drop-over { background: #ececfe; border-color: var(--text-action-high-blue-france, #000091); box-shadow: none; }
  .kb-hidden { display: none !important; }
  .kb-palette { padding: .5rem 1.5rem; background: var(--background-alt-grey, #f6f6f6); border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-pal-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .375rem .5rem; margin-bottom: .375rem; }
  .kb-pal-row:first-child { align-items: center; }
  .kb-pal-search { flex: 1; min-width: 10rem; max-width: 16rem; margin-left: auto; }
  .kb-pal-fields { display: flex; flex-wrap: wrap; gap: .375rem .5rem; flex: 1; max-height: 5.5rem; overflow-y: auto; align-items: center; }
  .kb-pal-label { font-size: .75rem; font-weight: 700; color: var(--text-mention-grey, #666); margin-right: .125rem; line-height: 1.75rem; }
  .kb-pal-hint { font-size: .75rem; color: var(--text-mention-grey, #666); }
  .kb-chip { border: 1px dashed var(--text-action-high-blue-france, #000091); background: #fff; border-radius: 1rem; padding: .125rem .75rem;
             font: inherit; font-size: .8125rem; cursor: grab; color: var(--text-default-grey, #3a3a3a); }
  .kb-chip:hover { background: #ececfe; }
  .kb-chip-el { font-weight: 700; border-style: solid; }
  .kb-toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #3a3a3a; color: #fff;
              padding: .5rem 1rem; border-radius: 4px; z-index: 60; display: none; font-size: .875rem; }
  .kb-toast.err { background: #ce0500; }
</style>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<header class="kb-bar">
  <h1 class="kb-title" id="kbTitle">Kanban</h1>
  <div class="kb-spacer"></div>
  <input class="fr-input fr-input--sm" type="search" id="kbSearch" placeholder="Rechercher une carte…" aria-label="Rechercher">
  <button class="fr-btn fr-btn--tertiary fr-btn--sm fr-icon-refresh-line" data-act="refresh" title="Recharger la structure">Recharger</button>
  <button class="fr-btn fr-btn--secondary fr-btn--sm fr-icon-settings-5-line fr-btn--icon-left kb-owner-only kb-hidden" data-act="settings">Configurer</button>
</header>
<main class="kb-board" id="kbBoard"></main>
<div class="kb-overlay" id="kbOverlay"></div>
<aside class="kb-drawer" id="kbDrawer" aria-label="Configuration"></aside>
<div class="kb-toast" id="kbToast"></div>

<script>
/* ------------------------------------------------------------------ *
 * Mode démo : si le widget est ouvert hors de Grist, on simule l'API
 * ------------------------------------------------------------------ */
const IN_GRIST = typeof grist !== 'undefined' && window.parent !== window;
/* En mode démo, ?role=owners|editors|viewers|error|probe-owner|probe-other simule la réponse de l'API Grist pour tester la détection du rôle */
const DEMO_ROLE = !IN_GRIST ? new URLSearchParams(location.search).get('role') : null;
if (!IN_GRIST) {
  const mockRows = [
    { id: 1, Titre: 'Cadrer le besoin utilisateur', Statut: 'À faire', Responsable: 1, Echeance: 1793923200, Priorite: 'Haute', Tags: ['L', 'Discovery', 'UX'], Description: 'Atelier avec les agents.', Avancement: 0.35, Budget: 12500.5, Solde: -1234.56, Valide: true, Actif: false, Lien: 'Spécifications https://example.org/spec', Cree: ['D', 1793923200, 'Pacific/Tahiti'] },
    { id: 2, Titre: 'Rédiger la note de cadrage', Statut: 'En cours', Responsable: 2, Echeance: 1794528000, Priorite: 'Moyenne', Tags: ['L', 'Doc'], Description: '' },
    { id: 3, Titre: 'Prototype du tableau de bord', Statut: 'En cours', Responsable: 1, Echeance: 1795132800, Priorite: 'Haute', Tags: ['L', 'UX'], Description: 'Version Grist.' },
    { id: 4, Titre: 'Valider avec la DNUM', Statut: 'Terminé', Responsable: 3, Echeance: 1792713600, Priorite: 'Basse', Tags: ['L'], Description: '' },
    { id: 5, Titre: 'Carte sans statut', Statut: '', Responsable: 0, Echeance: null, Priorite: '', Tags: ['L'], Description: '' },
  ];
  const people = { id: [1, 2, 3], Nom: ['Camille Durand', 'Sami Benali', 'Inès Martin'] };
  const tcols = [
    ['Titre', 'Text'], ['Statut', 'Choice'], ['Responsable', 'Ref:Personnes'], ['Echeance', 'Date'],
    ['Priorite', 'Choice'], ['Tags', 'ChoiceList'], ['Description', 'Text'],
    ['Avancement', 'Numeric'], ['Budget', 'Numeric'], ['Solde', 'Numeric'], ['Valide', 'Bool'], ['Actif', 'Bool'], ['Lien', 'Text'], ['Cree', 'DateTime:Pacific/Tahiti'],
  ];
  const wopts = {
    Statut: { choices: ['À faire', 'En cours', 'Terminé'], choiceOptions: { 'En cours': { fillColor: '#FEECC2', textColor: '#000' } } },
    Priorite: { choices: ['Haute', 'Moyenne', 'Basse'], choiceOptions: { Haute: { fillColor: '#FEE9E9', textColor: '#CE0500' } } },
    Tags: { choices: ['Discovery', 'UX', 'Doc'] },
    Avancement: { numMode: 'percent', decimals: 0 },
    Budget: { numMode: 'currency', currency: 'EUR' },
    Solde: { numMode: 'decimal', decimals: 1, numSign: 'parens' },
    Actif: { widget: 'Switch' },
    Lien: { widget: 'HyperLink' },
    Cree: { dateFormat: 'DD/MM/YYYY', timeFormat: 'HH:mm' },
  };
  let cbs = null, opts = {};
  if (DEMO_ROLE) {
    const realFetch = window.fetch.bind(window);
    const json = (status, body) => Promise.resolve(new Response(JSON.stringify(body || {}), { status }));
    window.fetch = (u, ...a) => {
      u = String(u);
      if (!u.startsWith('https://mock.invalid/')) return realFetch(u, ...a);
      if (DEMO_ROLE === 'error') return Promise.reject(new TypeError('Failed to fetch'));
      if (DEMO_ROLE === 'acl-owner') return json(404);          // l'API REST ne répond pas : seule la sonde ACL permet de conclure
      const probe = u.includes('/usersForViewAs');
      if (DEMO_ROLE.startsWith('probe-')) return probe ? json(DEMO_ROLE === 'probe-owner' ? 200 : 403) : json(200, {});   // pas de champ « access » : on bascule sur la sonde
      return probe ? json(403) : json(200, { id: 'demo', name: 'Démo', access: DEMO_ROLE });
    };
  }
  window.grist = {
    getAccessToken: async () => ({ baseUrl: 'https://mock.invalid/api/docs/demo', token: 'demo-token', ttlMsecs: 60000 }),
    ready() {},
    onOptions(cb) { cb(opts); this._o = cb; },
    setOptions(o) { opts = Object.assign(opts, o); this._o && this._o(opts); },
    onRecords(cb) { cbs = cb; cb(mockRows.map(r => ({ ...r }))); },
    getTable() {
      return {
        getTableId: async () => 'Tickets',
        update: async (u) => { [].concat(u).forEach(x => Object.assign(mockRows.find(r => r.id === x.id), x.fields)); cbs(mockRows.map(r => ({ ...r }))); },
        create: async (c) => { const id = Math.max(...mockRows.map(r => r.id)) + 1; mockRows.push({ id, Titre: 'Nouvelle carte', ...c.fields }); cbs(mockRows.map(r => ({ ...r }))); return { id }; },
      };
    },
    docApi: {
      async fetchTable(name) {
        if (name === '_grist_Tables') return { id: [1, 2], tableId: ['Tickets', 'Personnes'] };
        if (name === 'Tickets') { const o = { id: mockRows.map((r) => r.id) }; tcols.forEach(([c]) => { o[c] = mockRows.map((r) => r[c]); }); return o; }
        if (name === 'OwnerAccess') { if (DEMO_ROLE === 'acl-owner') return { id: [1] }; throw new Error('Access denied'); }   // sonde ACL simulée
        if (name === 'Personnes') return people;
        if (name === '_grist_DocInfo') return { id: [1], timezone: ['Europe/Paris'], documentSettings: [JSON.stringify({ locale: 'fr-FR', currency: 'EUR' })] };
        const ids = [], out = { id: [], parentId: [], parentPos: [], colId: [], label: [], type: [], widgetOptions: [], visibleCol: [], isFormula: [] };
        tcols.forEach(([c, t], i) => {
          out.id.push(10 + i); out.parentId.push(1); out.parentPos.push(i); out.colId.push(c); out.label.push(c === 'Priorite' ? 'Priorité' : c === 'Echeance' ? 'Échéance' : c);
          out.type.push(t); out.widgetOptions.push(JSON.stringify(wopts[c] || {})); out.visibleCol.push(c === 'Responsable' ? 50 : 0); out.isFormula.push(false);
        });
        out.id.push(50); out.parentId.push(2); out.parentPos.push(0); out.colId.push('Nom'); out.label.push('Nom'); out.type.push('Text');
        out.widgetOptions.push(''); out.visibleCol.push(0); out.isFormula.push(false);
        return out;
      },
    },
  };
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:.5rem;left:.5rem;z-index:70';
    b.innerHTML = '<span class="fr-badge fr-badge--info fr-badge--sm">Mode démo (hors Grist)</span>';
    document.body.appendChild(b);
  });
}

/* ------------------------------------------------------------------ *
 * Constantes & état
 * ------------------------------------------------------------------ */
const PALETTE = [
  { n: 'Bleu France',       bar: '#000091', bg: '#ececfe' },
  { n: 'Bleu cumulus',      bar: '#417dc4', bg: '#e6eefa' },
  { n: 'Vert émeraude',     bar: '#00a95f', bg: '#e3f9ec' },
  { n: 'Vert menthe',       bar: '#009081', bg: '#dff8f3' },
  { n: 'Jaune tournesol',   bar: '#c8aa39', bg: '#fdf4dc' },
  { n: 'Orange terre battue', bar: '#e4794a', bg: '#fdece6' },
  { n: 'Rouge marianne',    bar: '#e1000f', bg: '#fdeaea' },
  { n: 'Rose tuile',        bar: '#ce614a', bg: '#fbebe8' },
  { n: 'Violet glycine',    bar: '#a558a0', bg: '#f8e9f6' },
  { n: 'Marron caramel',    bar: '#c08c65', bg: '#f7ebe1' },
  { n: 'Gris',              bar: '#666666', bg: '#eeeeee' },
  { n: 'Gris clair',        bar: '#929292', bg: '#f6f6f6' },
];
const HIDE = /^(gristHelper_|manualSort)/;
const GROUP_TYPES = ['Choice', 'ChoiceList', 'Ref', 'RefList'];

let cfg = { groupCol: null, titleCol: null, cardFields: [], modalFields: null };
let meta = { loaded: false, tableId: '', cols: [], by: {} };
let refs = {};            // colId -> { rows:[{id,label}], map:{id:label} }
let records = [];
let search = '';
let modalId = null, getters = [];
let drag = null;
let defsCache = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const col = (id) => meta.by[id];
const isListType = (c) => c && (c.base === 'ChoiceList' || c.base === 'RefList');
const asList = (v) => {
  let a = Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v) : (v == null ? [] : [v]);
  return a.filter((x) => x !== '' && x !== 0 && x != null);
};
/* Date / DateTime -> secondes, quelle que soit la forme reçue (nombre, ['d'|'D', ts, tz], Date, moment, texte) */
const toSec = (v) => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  if (Array.isArray(v)) return typeof v[1] === 'number' ? v[1] : null;
  if (typeof v === 'string') { const t = Date.parse(v); return isNaN(t) ? null : t / 1000; }
  if (v instanceof Date) return v.getTime() / 1000;
  if (typeof v.valueOf === 'function' && typeof v.valueOf() === 'number') return v.valueOf() / 1000;
  return null;
};
/* ------------------------------------------------------------------ *
 * Droits : la configuration et la mise en page sont réservées aux propriétaires du document.
 * Le rôle vient de l'API REST de Grist (GET /docs/{id} → « access »). Tant qu'il est inconnu, ou si la
 * détection échoue, l'utilisateur est considéré comme NON propriétaire (réglages masqués).
 * Ce masquage ne concerne que l'interface : les droits réels restent ceux définis dans Grist.
 * Dépannage : ajouter ?forceOwner=1 à l'URL du widget désactive la détection (réglages toujours visibles).
 * ------------------------------------------------------------------ */
let isOwner = false;
const FORCE_OWNER = new URLSearchParams(location.search).get('forceOwner') === '1';
/* Méthodes essayées dans l'ordre (comme dans le widget « Fiche Produit »), la première qui répond l'emporte :
 *  1. grist.getUserSession(), si disponible        2. API REST /api/docs/{docId} (docId lu dans l'adresse de la page Grist)
 *  3. API REST via un jeton d'accès Grist           4. sonde ACL : lecture de la table « OwnerAccess »
 *     (table d'une ligne avec la règle « user.Access != OWNER → refuser la lecture » : lisible par les owners seulement) */
async function accessViaRest() {
  const docId = [document.referrer, location.href].map((s) => {
    const m = s && (s.match(/\/o\/[^/]+\/([a-zA-Z0-9_-]{6,})(?:\/|$)/) || s.match(/\/doc\/([a-zA-Z0-9_-]{6,})/));
    return m ? m[1] : null;
  }).find(Boolean);
  let origin = null; try { origin = new URL(document.referrer).origin; } catch (e) {}
  if (!docId || !origin) return null;
  try {
    const r = await fetch(`${origin}/api/docs/${docId}`, { credentials: 'include' });
    if (r.ok) { const d = await r.json(); return d && typeof d.access === 'string' ? d.access : null; }
  } catch (e) {}
  return null;
}
async function accessViaToken() {
  try {
    const t = await grist.getAccessToken({ readOnly: false });   // un jeton « lecture seule » ramènerait le rôle à « lecteur »
    const q = '?auth=' + encodeURIComponent(t.token);
    const res = await fetch(t.baseUrl + q);
    if (res.ok) { const d = await res.json(); if (d && typeof d.access === 'string') return d.access; }
    const probe = await fetch(t.baseUrl + '/usersForViewAs' + q);   // adresse accessible aux seuls propriétaires
    if (probe.ok) return 'owners';
  } catch (e) {}
  return null;
}
async function accessViaProbe() {
  try { await grist.docApi.fetchTable('OwnerAccess'); return 'owners'; }
  catch (e) {
    if (/not found|no such|unknown table|keyerror|does not exist/i.test(String((e && e.message) || e))) return null;   // la table n'existe pas : on ne peut pas conclure

        const el = $('#' + id);

        const t = el.dataset.val !== undefined ? el.dataset.val : (el.value.trim() === '' ? '' : String(ne.parse(el.value)));

        ? `<div class="fr-toggle ${full ? 'kb-full' : ''}" style="margin-bottom:1rem"><input type="checkbox" class="fr-toggle__input" id="${id}" ${raw ? 'checked' : ''} ${ro ? 'disabled' : ''}><label class="fr-toggle__label" for="${id}">${esc(c.label)}</label></div>`
        : `<div class="fr-checkbox-group ${full ? 'kb-full' : ''}" style="margin-bottom:1rem"><input type="checkbox" id="${id}" ${raw ? 'checked' : ''} ${ro ? 'disabled' : ''}><label class="fr-label" for="${id}">${esc(c.label)}</label></div>`;
    }

    }

/* --- fenêtre ------------------------------------------------------------ */
function renderModal() {

/* --- modifications de la mise en page --------------------------------- */
function enterLayout() {
  if (!isOwner) return;
  draft = {};
  getters.forEach(([c, get]) => { if (!c.readOnly) { try { draft[c.colId] = get(); } catch (e) {} } });
  editLayout = true; renderModal();
}
function saveLayout() { saveCfg(); renderModal(); }

  if (spec.type === 'section') return { type: 'section', id: uid(), text: 'Nouvelle section' };
  if (spec.type === 'divider') return { type: 'divider' };

/* bloc (ou zone de dépôt) le plus proche du pointeur dans un conteneur, hors élément en cours de déplacement */

    if (n.classList.contains('row-dragging') || n.closest('.row-dragging')) return;
    const r = n.getBoundingClientRect();

  if (!onHead && mdrag.kind !== 'section' && (!el || isSection(L[Number(el.dataset.i)]))) {

    case 'closeSettings': $('#kbDrawer').classList.remove('open'); break;
    case 'close': closeModal(); break;
    case 'save': saveModal(); break;
    case 'refresh': await loadMeta(); normRecords(); renderBoard(); renderDrawer(); toast('Structure rechargée'); break;
    case 'rm': cfg.cardFields.splice(i, 1); persist(); break;
    /* popup : mode mise en page */
    case 'editLayout': enterLayout(); break;
    case 'doneLayout': editLayout = false; renderModal(); break;
    case 'toggleSec': { const k = a.dataset.key; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); renderModal(); break; }
    case 'blkW': { const b = blocks()[i]; if (b) { b.w = b.w === 'full' ? 'half' : 'full'; saveLayout(); } break; }
    case 'secFold': { const b = blocks()[i]; if (b) { b.fold = !b.fold; if (!b.fold) delete b.closed; saveLayout(); } break; }
    case 'secClosed': { const b = blocks()[i]; if (b) { b.closed = !b.closed; saveLayout(); } break; }
    case 'blkRm': blocks().splice(i, 1); saveLayout(); break;
    case 'addBlk': { let spec; try { spec = JSON.parse(a.dataset.spec); } catch (x) { break; } blocks().push(newBlock(spec)); saveLayout(); break; }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.blk === 'text') {          // texte d'un titre / d'une section (popup) : pas de nouveau rendu, on garde le focus
    const b = blocks()[Number(t.dataset.i)];
    if (b) { b.text = t.value; saveCfg(); }
    return;
  }
  const k = t.dataset && t.dataset.cfg; if (!k) return;
  if (k === 'groupCol') cfg.groupCol = t.value || null;
  else if (k === 'titleCol') cfg.titleCol = t.value;
  else if (k === 'addCard') { if (t.value) cfg.cardFields.push({ col: t.value }); }
  persist();
});
/* champs numériques de la popup : valeur brute à l'édition, format de la colonne au repos */
document.addEventListener('focusin', (e) => {
  const t = e.target; if (!t.classList || !t.classList.contains('kb-num') || t.dataset.dirty === '1') return;
  t.value = t.dataset.plain; t.select();
});
document.addEventListener('focusout', (e) => {
  const t = e.target; if (!t.classList || !t.classList.contains('kb-num')) return;
  if (t.dataset.dirty !== '1') { t.value = t.dataset.shown; return; }
  const c = col(t.dataset.col); if (!c) return;
  if (t.value.trim() === '') { t.dataset.val = ''; return; }
  const n = numEdit(c).parse(t.value);
  if (isNaN(n)) { delete t.dataset.val; t.classList.add('fr-input--error'); return; }
  t.classList.remove('fr-input--error');
  t.dataset.val = String(n); t.value = numEdit(c).fmt(c.base === 'Int' ? Math.round(n) : n);
});
document.addEventListener('input', (e) => {
  const t = e.target; if (t.classList && t.classList.contains('kb-num')) { t.dataset.dirty = '1'; delete t.dataset.val; }
});
$('#kbSearch').addEventListener('input', (e) => { search = e.target.value.trim().toLowerCase(); renderBoard(); });
document.addEventListener('input', (e) => {             // recherche d'un champ dans la barre d'éléments (pas de nouveau rendu : on garde le focus)
  if (e.target.dataset && e.target.dataset.blk === 'search') { palSearch = e.target.value; filterPalette(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const t = e.target;
  if (t && t.dataset && t.dataset.blk === 'search' && t.value) { t.value = ''; palSearch = ''; filterPalette(); return; }   // Échap efface d'abord la recherche
  closeModal(); $('#kbDrawer').classList.remove('open');
});

/* Réordonnancement des champs (panneau de configuration) : on ne peut saisir une ligne que par sa poignée */
let rdrag = null;   // { list: 'card' | 'modal', i, target?: { i, after } }
const MARKS = ['row-dragging', 'drop-before', 'drop-after', 'drop-left', 'drop-right', 'drop-over'];
const clearRowMarks = () => document.querySelectorAll(MARKS.map((m) => '.' + m).join(',')).forEach((n) => n.classList.remove(...MARKS));
const resetGrips = () => document.querySelectorAll('.kb-row[draggable=true],.kb-blk[draggable=true]').forEach((n) => (n.draggable = false));
document.addEventListener('mousedown', (e) => {
  const g = e.target.closest && e.target.closest('.kb-grip, .kb-blk-kind');     // poignée ou libellé de la barre
  const host = g && g.closest('.kb-row, .kb-blk');
  if (host) host.draggable = true;
});
document.addEventListener('mouseup', resetGrips);
document.addEventListener('dragstart', (e) => {
  /* popup : élément de la palette ou bloc saisi par sa poignée */
  const chip = e.target.closest && e.target.closest('.kb-chip');
  const blk = !chip && e.target.closest && e.target.closest('.kb-blk');
  if (chip || blk) {
    if (chip) { try { mdrag = { kind: 'new', spec: JSON.parse(chip.dataset.spec) }; } catch (x) { return; } }
    else {
      const i = Number(blk.dataset.i), b = blocks()[i];
      mdrag = isSection(b) ? { kind: 'section', from: i, to: secEnd(i) } : { kind: 'block', from: i };
      blk.classList.add('row-dragging');
    }
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'bloc'); } catch (x) {}
    return;
  }
  const row = e.target.closest && e.target.closest('.kb-row');
  if (row) {
    rdrag = { list: row.dataset.list, i: Number(row.dataset.i) };
    row.classList.add('row-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'field'); } catch (x) {}
    return;
  }
  const card = e.target.closest && e.target.closest('.kb-card'); if (!card) return;
  drag = { id: Number(card.dataset.id), from: Number(card.dataset.idx) };
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(drag.id)); } catch (x) {}
});
document.addEventListener('dragend', () => {
  drag = null; rdrag = null; mdrag = null; clearRowMarks(); resetGrips();
  document.querySelectorAll('.dragging,.drag-over').forEach((n) => n.classList.remove('dragging', 'drag-over'));
});
document.addEventListener('dragover', (e) => {
  if (mdrag) {
    const t = dropTarget(e);
    const keep = mdrag.kind === 'block' || mdrag.kind === 'section' ? document.querySelector('.kb-blk.row-dragging') : null;
    clearRowMarks(); if (keep) keep.classList.add('row-dragging');
    mdrag.pos = undefined;
    if (!t || !validPos(t.pos)) return;
    e.preventDefault();
    mdrag.pos = t.pos;
    t.el.classList.add(({ before: 'drop-before', after: 'drop-after', left: 'drop-left', right: 'drop-right', over: 'drop-over' })[t.side]);
    return;
  }
  if (rdrag) {
    const row = e.target.closest && e.target.closest('.kb-row');
    if (!row || row.dataset.list !== rdrag.list) return;
    e.preventDefault();
    const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    clearRowMarks();
    document.querySelectorAll('.kb-row').forEach((n) => { if (n.dataset.list === rdrag.list && Number(n.dataset.i) === rdrag.i) n.classList.add('row-dragging'); });
    row.classList.add(after ? 'drop-after' : 'drop-before');
    rdrag.target = { i: Number(row.dataset.i), after };
    return;
  }
  const body = e.target.closest && e.target.closest('.kb-col'); if (!body || !drag) return;
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach((n) => n.classList.remove('drag-over'));
  body.querySelector('.kb-col-body').classList.add('drag-over');
});
document.addEventListener('drop', (e) => {
  if (mdrag) {
    e.preventDefault();
    const m = mdrag; mdrag = null; clearRowMarks(); resetGrips();
    if (m.pos !== undefined) applyDrop(m);
    return;
  }
  if (rdrag) {
    e.preventDefault();
    const { list: name, i: from, target } = rdrag;
    rdrag = null; clearRowMarks();
    const list = name === 'modal' ? cfg.modalFields : cfg.cardFields;
    if (!list || !target) return;
    let to = target.i + (target.after ? 1 : 0);
    if (from < to) to--;
    if (to !== from) { const [it] = list.splice(from, 1); list.splice(to, 0, it); persist(); }
    return;
  }
  const colEl = e.target.closest && e.target.closest('.kb-col'); if (!colEl || !drag) return;
  e.preventDefault();
  const { id, from } = drag; drag = null;
  moveCard(id, from, Number(colEl.dataset.idx));
});

/* ------------------------------------------------------------------ *
 * Démarrage
 * ------------------------------------------------------------------ */
/* Par défaut Grist renvoie le libellé des références, pas leur identifiant : on demande les identifiants
   (expandRefs: false) et, par sécurité, on retraduit un éventuel libellé en identifiant. */
function refIdOf(c, v) {
  if (Array.isArray(v) && v[0] === 'R') v = v[2];        // forme codée ['R', table, identifiant ou libellé]
  if (typeof v === 'number' || v == null || v === '') return v;
  const hit = (refs[c.colId]?.rows || []).find((x) => x.label === v);
  return hit ? hit.id : v;
}
function normRecords() {
  const rc = meta.cols.filter((c) => c.base === 'Ref' || c.base === 'RefList');
  if (!rc.length) return;
  records.forEach((r) => rc.forEach((c) => {
    const v = r[c.colId];
    if (c.base === 'Ref') r[c.colId] = refIdOf(c, v);
    else if (Array.isArray(v)) r[c.colId] = ['L', ...asList(v).map((x) => refIdOf(c, x))];
  }));
}

grist.ready({ requiredAccess: 'full', onEditOptions: openSettings });
detectOwner().then((v) => { isOwner = v; applyRole(); });
grist.onOptions((o) => {
  const c = (o && o.cfg) || {};
  if (sentCfg.includes(JSON.stringify(c))) return;       // écho de notre propre enregistrement
  cfg = { groupCol: c.groupCol || cfg.groupCol, titleCol: c.titleCol || cfg.titleCol, cardFields: c.cardFields || cfg.cardFields,
          modalFields: c.modalFields || cfg.modalFields };
  renderBoard();
});
/* onRecords sert à savoir QUELLES lignes afficher (filtres, liens entre widgets) et à être prévenu des changements.
   Les valeurs, elles, sont relues en brut (identifiants, dates en nombre, listes ['L', …]) : c'est le seul format
   fiable, quelle que soit la version de Grist. */
let loadSeq = 0;
async function loadRecords(rows) {
  const seq = ++loadSeq;
  let raw = null;
  try { raw = await grist.docApi.fetchTable(meta.tableId || await grist.getTable().getTableId()); } catch (e) {}
  if (seq !== loadSeq) return;                           // une mise à jour plus récente est arrivée entre-temps
  if (raw && Array.isArray(raw.id)) {
    const idx = new Map(raw.id.map((id, i) => [id, i]));
    const keys = Object.keys(raw).filter((k) => k !== 'id');
    records = rows.map((row) => {
      const i = idx.get(row.id);
      if (i === undefined) return row;
      const rec = { id: row.id };
      keys.forEach((k) => { rec[k] = raw[k][i]; });
      return rec;
    });
  } else records = rows;
  normRecords();
  renderBoard();
  if (modalId !== null && !records.some((r) => r.id === modalId)) closeModal();
}
grist.onRecords((rows) => { loadRecords(rows); }, { includeColumns: 'shown', keepEncoded: true, expandRefs: false, format: 'rows' });
renderBoard();
loadMeta().then(() => {
  if (!cfg.cardFields.length) {
    cfg.cardFields = meta.cols.filter((c) => c.colId !== cfg.titleCol && c.colId !== cfg.groupCol && ['Date', 'Choice', 'Ref'].includes(c.base)).slice(0, 3)
      .map((c) => ({ col: c.colId }));
  }
  if (!cfg.modalFields) cfg.modalFields = cfg.cardFields.map((f) => ({ col: f.col, w: defaultWidth(col(f.col)) }));
  normRecords();
  renderBoard(); renderDrawer();
}).catch((e) => { $('#kbBoard').innerHTML = `<div class="kb-empty"><p>Impossible de lire la structure de la table.</p><p class="fr-hint-text">${esc(e.message || e)}<br>Vérifiez que le widget a l’accès « Accès complet au document ».</p></div>`; });
</script>
</body>
