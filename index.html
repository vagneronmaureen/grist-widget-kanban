<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban DSFR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/icons/icons.min.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden;
         background: var(--background-alt-grey, #f6f6f6); color: var(--text-default-grey, #3a3a3a); }
  .kb-bar { display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem; background: #fff;
            border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-bar .kb-title { font-weight: 700; font-size: 1rem; color: var(--text-title-grey, #161616); margin: 0; }
  .kb-bar .kb-spacer { flex: 1; }
  .kb-bar input[type=search] { max-width: 260px; }
  .kb-board { flex: 1; overflow: auto; display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }
  .kb-empty { margin: auto; text-align: center; padding: 2rem; }

  .kb-col { flex: 0 0 290px; max-height: 100%; display: flex; flex-direction: column; border-radius: 4px;
            background: var(--col-bg); border-top: 4px solid var(--col-bar); position: relative; }
  .kb-col-head { display: flex; align-items: center; gap: .5rem; padding: .625rem .75rem; }
  .kb-col-body { padding-bottom: .75rem !important; }
  .kb-modal-head input.fr-input { font-size: 1.125rem; font-weight: 700; flex: 1; }
  .kb-col-name { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 color: var(--text-title-grey, #161616); }
  .kb-count { background: #fff; border-radius: 1rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700; line-height: 1.5rem; }
  .kb-col-body { padding: 0 .5rem .5rem; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; min-height: 3rem; flex: 1; }
  .kb-col-body.drag-over { outline: 2px dashed var(--col-bar); outline-offset: -4px; border-radius: 4px; }

  .kb-card { background: #fff; border-radius: 4px; padding: .75rem; cursor: grab;
             box-shadow: 0 0 0 1px var(--border-default-grey, #ddd); }
  .kb-card:hover { box-shadow: 0 0 0 1px var(--text-action-high-blue-france, #000091), 0 2px 6px rgba(0,0,0,.12); }
  .kb-card.dragging { opacity: .4; }
  .kb-card-title { margin: 0 0 .25rem; font-size: 1rem; line-height: 1.4; font-weight: 700; color: var(--text-title-grey, #161616); }
  .kb-fields { display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; font-size: .875rem; }
  .kb-f { display: block; }
  .kb-f-label { color: var(--text-mention-grey, #666); font-size: .75rem; line-height: 1.25rem; }
  .kb-f-val { line-height: 1.5rem; }
  .kb-badges { display: flex; flex-wrap: wrap; gap: .25rem; }
  .kb-badge { display: inline-block; border-radius: .25rem; padding: 0 .5rem; font-size: .75rem; font-weight: 700;
              line-height: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }

  .kb-overlay { position: fixed; inset: 0; background: rgba(22,22,22,.64); z-index: 50; display: none;
                align-items: center; justify-content: center; padding: 1rem; }
  .kb-overlay.open { display: flex; }
  .kb-modal { background: #fff; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 4px; }
  .kb-modal-head { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-modal-head h2 { margin: 0; flex: 1; font-size: 1.25rem; }
  .kb-modal-head { align-items: center; }
  .kb-modal-body { padding: 1rem 1.5rem; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; align-content: start; flex: 1; }
  .kb-modal-body .fr-input-group { margin-bottom: 1rem; }
  .kb-modal-body .kb-full { grid-column: 1 / -1; }
  .kb-modal-foot { padding: 1rem 1.5rem; border-top: 1px solid var(--border-default-grey, #ddd); display: flex; justify-content: flex-end; gap: .75rem; }
  .kb-checks { display: flex; flex-wrap: wrap; gap: .25rem 1rem; max-height: 9rem; overflow-y: auto; }
  .kb-checks label { display: flex; gap: .375rem; align-items: center; font-size: .875rem; }

  .kb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #fff; z-index: 40;
               box-shadow: -4px 0 16px rgba(0,0,0,.2); transform: translateX(105%); transition: transform .2s; overflow-y: auto; }
  .kb-drawer.open { transform: none; }
  .kb-drawer section { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-drawer h3 { font-size: .9375rem; margin: 0 0 .75rem; }
  .kb-row { display: flex; gap: .375rem; align-items: center; margin-bottom: .375rem; }
  .kb-row .kb-row-name { flex: 1; font-size: .875rem; overflow: hidden; text-overflow: ellipsis; }
  .kb-row select { width: auto; }
  .kb-row { border-radius: 4px; padding: .125rem .25rem; background: #fff; }
  .kb-grip { cursor: grab; font-size: 1.25rem; line-height: 1; color: var(--text-mention-grey, #666); padding: 0 .25rem; user-select: none; }
  .kb-row:hover .kb-grip { color: var(--text-action-high-blue-france, #000091); }
  .row-dragging { opacity: .4; }
  .drop-before { box-shadow: 0 -3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-after { box-shadow: 0 3px 0 var(--text-action-high-blue-france, #000091); }
  .drop-left { box-shadow: -3px 0 0 var(--text-action-high-blue-france, #000091); }
  .drop-right { box-shadow: 3px 0 0 var(--text-action-high-blue-france, #000091); }

  /* popup : mise en page */
  .kb-heading { margin: .5rem 0 .75rem; font-size: 1.125rem; line-height: 1.5; color: var(--text-title-grey, #161616); }
  .kb-divider { border: 0; border-top: 1px solid var(--border-default-grey, #ddd); margin: .5rem 0 1rem; padding: 0; }
  .kb-section { border: 1px solid var(--border-default-grey, #ddd); border-radius: 4px; margin-bottom: 1rem; padding: 0 1rem; }
  .kb-sec-toggle { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: .75rem 0;
                   font: inherit; font-weight: 700; font-size: 1.0625rem; color: var(--text-title-grey, #161616); }
  .kb-chev { display: inline-block; width: 1.25rem; color: var(--text-action-high-blue-france, #000091); }
  .kb-sec-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; padding-top: .25rem; }
  .kb-section.kb-collapsed .kb-sec-body { display: none; }
  .kb-sec-body .kb-full { grid-column: 1 / -1; }
  .kb-sec-input, .kb-heading-input { font-weight: 700; margin-bottom: .5rem; }
  .kb-blk { border: 1px dashed transparent; border-radius: 4px; padding: .25rem .375rem 0; margin-bottom: .25rem; }
  .kb-blk:hover { border-color: var(--border-default-grey, #bbb); }
  .kb-blk-bar { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: var(--text-mention-grey, #666); margin-bottom: .25rem; }
  .kb-blk-kind { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kb-mini { background: #fff; border: 1px solid var(--border-default-grey, #ccc); border-radius: 3px; font-size: .75rem; padding: 0 .5rem; cursor: pointer; line-height: 1.375rem; }
  .kb-mini:hover { border-color: var(--text-action-high-blue-france, #000091); }
  .kb-dropzone { border: 1px dashed var(--border-default-grey, #bbb); border-radius: 4px; color: var(--text-mention-grey, #888);
                 font-size: .8125rem; text-align: center; padding: .375rem; margin: .25rem 0 .75rem; }
  .kb-dropzone.drop-over, .kb-blk.drop-over { background: #ececfe; border-color: var(--text-action-high-blue-france, #000091); box-shadow: none; }
  .kb-palette { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .5rem; padding: .5rem 1.5rem; max-height: 9rem; overflow-y: auto;
                background: var(--background-alt-grey, #f6f6f6); border-bottom: 1px solid var(--border-default-grey, #ddd); }
  .kb-pal-label { font-size: .75rem; font-weight: 700; color: var(--text-mention-grey, #666); margin-right: .125rem; }
  .kb-pal-hint { flex-basis: 100%; font-size: .75rem; color: var(--text-mention-grey, #666); }
  .kb-chip { border: 1px dashed var(--text-action-high-blue-france, #000091); background: #fff; border-radius: 1rem; padding: .125rem .75rem;
             font: inherit; font-size: .8125rem; cursor: grab; color: var(--text-default-grey, #3a3a3a); }
  .kb-chip:hover { background: #ececfe; }
  .kb-chip-el { font-weight: 700; border-style: solid; }
  .kb-toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: #3a3a3a; color: #fff;
              padding: .5rem 1rem; border-radius: 4px; z-index: 60; display: none; font-size: .875rem; }
  .kb-toast.err { background: #ce0500; }
</style>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<header class="kb-bar">
  <h1 class="kb-title" id="kbTitle">Kanban</h1>
  <div class="kb-spacer"></div>
  <input class="fr-input fr-input--sm" type="search" id="kbSearch" placeholder="Rechercher une carte…" aria-label="Rechercher">
  <button class="fr-btn fr-btn--tertiary fr-btn--sm fr-icon-refresh-line" data-act="refresh" title="Recharger la structure">Recharger</button>
  <button class="fr-btn fr-btn--secondary fr-btn--sm fr-icon-settings-5-line fr-btn--icon-left" data-act="settings">Configurer</button>
</header>
<main class="kb-board" id="kbBoard"></main>
<div class="kb-overlay" id="kbOverlay"></div>
<aside class="kb-drawer" id="kbDrawer" aria-label="Configuration"></aside>
<div class="kb-toast" id="kbToast"></div>

<script>
/* ------------------------------------------------------------------ *
 * Mode démo : si le widget est ouvert hors de Grist, on simule l'API
 * ------------------------------------------------------------------ */
const IN_GRIST = typeof grist !== 'undefined' && window.parent !== window;
if (!IN_GRIST) {
  const mockRows = [
    { id: 1, Titre: 'Cadrer le besoin utilisateur', Statut: 'À faire', Responsable: 1, Echeance: 1793923200, Priorite: 'Haute', Tags: ['L', 'Discovery', 'UX'], Description: 'Atelier avec les agents.' },
    { id: 2, Titre: 'Rédiger la note de cadrage', Statut: 'En cours', Responsable: 2, Echeance: 1794528000, Priorite: 'Moyenne', Tags: ['L', 'Doc'], Description: '' },
    { id: 3, Titre: 'Prototype du tableau de bord', Statut: 'En cours', Responsable: 1, Echeance: 1795132800, Priorite: 'Haute', Tags: ['L', 'UX'], Description: 'Version Grist.' },
    { id: 4, Titre: 'Valider avec la DNUM', Statut: 'Terminé', Responsable: 3, Echeance: 1792713600, Priorite: 'Basse', Tags: ['L'], Description: '' },
    { id: 5, Titre: 'Carte sans statut', Statut: '', Responsable: 0, Echeance: null, Priorite: '', Tags: ['L'], Description: '' },
  ];
  const people = { id: [1, 2, 3], Nom: ['Camille Durand', 'Sami Benali', 'Inès Martin'] };
  const tcols = [
    ['Titre', 'Text'], ['Statut', 'Choice'], ['Responsable', 'Ref:Personnes'], ['Echeance', 'Date'],
    ['Priorite', 'Choice'], ['Tags', 'ChoiceList'], ['Description', 'Text'],
  ];
  const wopts = {
    Statut: { choices: ['À faire', 'En cours', 'Terminé'], choiceOptions: { 'En cours': { fillColor: '#FEECC2', textColor: '#000' } } },
    Priorite: { choices: ['Haute', 'Moyenne', 'Basse'], choiceOptions: { Haute: { fillColor: '#FEE9E9', textColor: '#CE0500' } } },
    Tags: { choices: ['Discovery', 'UX', 'Doc'] },
  };
  let cbs = null, opts = {};
  window.grist = {
    ready() {},
    onOptions(cb) { cb(opts); this._o = cb; },
    setOptions(o) { opts = Object.assign(opts, o); this._o && this._o(opts); },
    onRecords(cb) { cbs = cb; cb(mockRows.map(r => ({ ...r }))); },
    getTable() {
      return {
        getTableId: async () => 'Tickets',
        update: async (u) => { [].concat(u).forEach(x => Object.assign(mockRows.find(r => r.id === x.id), x.fields)); cbs(mockRows.map(r => ({ ...r }))); },
        create: async (c) => { const id = Math.max(...mockRows.map(r => r.id)) + 1; mockRows.push({ id, Titre: 'Nouvelle carte', ...c.fields }); cbs(mockRows.map(r => ({ ...r }))); return { id }; },
      };
    },
    docApi: {
      async fetchTable(name) {
        if (name === '_grist_Tables') return { id: [1, 2], tableId: ['Tickets', 'Personnes'] };
        if (name === 'Tickets') { const o = { id: mockRows.map((r) => r.id) }; tcols.forEach(([c]) => { o[c] = mockRows.map((r) => r[c]); }); return o; }
        if (name === 'Personnes') return people;
        const ids = [], out = { id: [], parentId: [], parentPos: [], colId: [], label: [], type: [], widgetOptions: [], visibleCol: [], isFormula: [] };
        tcols.forEach(([c, t], i) => {
          out.id.push(10 + i); out.parentId.push(1); out.parentPos.push(i); out.colId.push(c); out.label.push(c === 'Priorite' ? 'Priorité' : c === 'Echeance' ? 'Échéance' : c);
          out.type.push(t); out.widgetOptions.push(JSON.stringify(wopts[c] || {})); out.visibleCol.push(c === 'Responsable' ? 50 : 0); out.isFormula.push(false);
        });
        out.id.push(50); out.parentId.push(2); out.parentPos.push(0); out.colId.push('Nom'); out.label.push('Nom'); out.type.push('Text');
        out.widgetOptions.push(''); out.visibleCol.push(0); out.isFormula.push(false);
        return out;
      },
    },
  };
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:.5rem;left:.5rem;z-index:70';
    b.innerHTML = '<span class="fr-badge fr-badge--info fr-badge--sm">Mode démo (hors Grist)</span>';
    document.body.appendChild(b);
  });
}

/* ------------------------------------------------------------------ *
 * Constantes & état
 * ------------------------------------------------------------------ */
const PALETTE = [
  { n: 'Bleu France',       bar: '#000091', bg: '#ececfe' },
  { n: 'Bleu cumulus',      bar: '#417dc4', bg: '#e6eefa' },
  { n: 'Vert émeraude',     bar: '#00a95f', bg: '#e3f9ec' },
  { n: 'Vert menthe',       bar: '#009081', bg: '#dff8f3' },
  { n: 'Jaune tournesol',   bar: '#c8aa39', bg: '#fdf4dc' },
  { n: 'Orange terre battue', bar: '#e4794a', bg: '#fdece6' },
  { n: 'Rouge marianne',    bar: '#e1000f', bg: '#fdeaea' },
  { n: 'Rose tuile',        bar: '#ce614a', bg: '#fbebe8' },
  { n: 'Violet glycine',    bar: '#a558a0', bg: '#f8e9f6' },
  { n: 'Marron caramel',    bar: '#c08c65', bg: '#f7ebe1' },
  { n: 'Gris',              bar: '#666666', bg: '#eeeeee' },
  { n: 'Gris clair',        bar: '#929292', bg: '#f6f6f6' },
];
const HIDE = /^(gristHelper_|manualSort)/;
const GROUP_TYPES = ['Choice', 'ChoiceList', 'Ref', 'RefList'];

let cfg = { groupCol: null, titleCol: null, cardFields: [], modalFields: null };
let meta = { loaded: false, tableId: '', cols: [], by: {} };
let refs = {};            // colId -> { rows:[{id,label}], map:{id:label} }
let records = [];
let search = '';
let modalId = null, getters = [];
let drag = null;
let defsCache = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const col = (id) => meta.by[id];
const isListType = (c) => c && (c.base === 'ChoiceList' || c.base === 'RefList');
const asList = (v) => {
  let a = Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v) : (v == null ? [] : [v]);
  return a.filter((x) => x !== '' && x !== 0 && x != null);
};
/* Date / DateTime -> secondes, quelle que soit la forme reçue (nombre, ['d'|'D', ts, tz], Date, moment, texte) */
const toSec = (v) => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  if (Array.isArray(v)) return typeof v[1] === 'number' ? v[1] : null;
  if (typeof v === 'string') { const t = Date.parse(v); return isNaN(t) ? null : t / 1000; }
  if (v instanceof Date) return v.getTime() / 1000;
  if (typeof v.valueOf === 'function' && typeof v.valueOf() === 'number') return v.valueOf() / 1000;
  return null;
};
function toast(msg, err) {
  const t = $('#kbToast'); t.textContent = msg; t.className = 'kb-toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), err ? 5000 : 2200);
}
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

/* ------------------------------------------------------------------ *
 * Métadonnées (colonnes, choix, tables référencées)
 * ------------------------------------------------------------------ */
async function loadMeta() {
  const tid = await grist.getTable().getTableId();
  const [T, C] = await Promise.all([grist.docApi.fetchTable('_grist_Tables'), grist.docApi.fetchTable('_grist_Tables_column')]);
  const tRef = T.id[T.tableId.indexOf(tid)];
  const idToColId = {};
  C.id.forEach((id, i) => (idToColId[id] = C.colId[i]));
  const cols = [];
  C.id.forEach((id, i) => {
    if (C.parentId[i] !== tRef || HIDE.test(C.colId[i])) return;
    const type = C.type[i] || 'Any';
    const [base, arg] = type.split(':');
    let o = {}; try { o = JSON.parse(C.widgetOptions[i] || '{}'); } catch (e) {}
    cols.push({
      colId: C.colId[i], label: C.label[i] || C.colId[i], type, base, pos: C.parentPos ? C.parentPos[i] : i,
      refTable: base === 'Ref' || base === 'RefList' ? arg : null,
      visCol: C.visibleCol && C.visibleCol[i] ? idToColId[C.visibleCol[i]] : null,
      opts: o, readOnly: !!C.isFormula[i],
    });
  });
  cols.sort((a, b) => a.pos - b.pos);
  meta = { loaded: true, tableId: tid, cols, by: Object.fromEntries(cols.map((c) => [c.colId, c])) };
  refs = {};
  await Promise.all(cols.filter((c) => c.refTable).map(async (c) => {
    try {
      const d = await grist.docApi.fetchTable(c.refTable);
      const lab = c.visCol && d[c.visCol] ? d[c.visCol] : d.id;
      const rows = d.id.map((id, i) => ({ id, label: String(lab[i] ?? '') }));
      refs[c.colId] = { rows, map: Object.fromEntries(rows.map((r) => [r.id, r.label])) };
    } catch (e) { refs[c.colId] = { rows: [], map: {} }; }
  }));
  if (!cfg.groupCol || !col(cfg.groupCol)) {
    const g = cols.find((c) => GROUP_TYPES.includes(c.base));
    if (g) cfg.groupCol = g.colId;
  }
  if (!cfg.titleCol || !col(cfg.titleCol)) {
    const t = cols.find((c) => c.base === 'Text') || cols[0];
    if (t) cfg.titleCol = t.colId;
  }
}

/* ------------------------------------------------------------------ *
 * Valeurs & affichage
 * ------------------------------------------------------------------ */
function fmtDate(raw, withTime) {
  const sec = toSec(raw);
  if (sec == null) return '';
  const d = new Date(sec * 1000);
  return withTime ? d.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : d.toLocaleDateString('fr-FR', { timeZone: 'UTC' });
}
function valueList(c, raw) {
  switch (c.base) {
    case 'Ref': case 'RefList': return asList(raw).map((id) => (refs[c.colId]?.map[id] ?? String(id)));
    case 'Choice': case 'ChoiceList': return asList(raw).map(String);
    case 'Date': return [fmtDate(raw)].filter(Boolean);
    case 'DateTime': return [fmtDate(raw, true)].filter(Boolean);
    case 'Bool': return [raw ? 'Oui' : 'Non'];
    case 'Numeric': case 'Int': return raw == null || raw === '' ? [] : [Number(raw).toLocaleString('fr-FR')];
    default: return raw == null || raw === '' ? [] : [typeof raw === 'object' ? '' : String(raw)];
  }
}
const displayText = (colId, r) => { const c = col(colId); return c ? valueList(c, r[colId]).join(', ') : ''; };
function badgeColor(c, label) {
  const o = c.opts && c.opts.choiceOptions && c.opts.choiceOptions[label];
  if (o && o.fillColor) return { bg: o.fillColor, fg: o.textColor || '#161616' };
  const p = PALETTE[hash(label) % PALETTE.length];
  return { bg: p.bg, fg: p.bar };
}

/* ------------------------------------------------------------------ *
 * Colonnes du kanban
 * ------------------------------------------------------------------ */
function groupDefs() {
  const gc = col(cfg.groupCol);
  if (!gc) return [];
  let defs = [];
  if (gc.base === 'Choice' || gc.base === 'ChoiceList') {
    const co = (gc.opts && gc.opts.choiceOptions) || {};
    defs = ((gc.opts && gc.opts.choices) || []).map((c) => ({ key: c, label: c, color: co[c] && co[c].fillColor }));
  } else {
    defs = (refs[gc.colId]?.rows || []).map((r) => ({ key: r.id, label: r.label }));
  }
  defs.unshift({ key: null, label: 'Sans valeur' });
  return defs.map((d, i) => ({ ...d, idx: i, color: colorOf(d, i) }));
}
function colorOf(d, i) {
  if (d.color) return { bar: d.color, bg: '#f6f6f6' };
  if (d.key === null) return PALETTE[11];
  return PALETTE[(i - 1) % 10];
}
function inColumn(r, key) {
  const vals = asList(r[cfg.groupCol]);
  return key === null ? vals.length === 0 : vals.includes(key);
}
function matches(r) {
  if (!search) return true;
  const ids = [cfg.titleCol, ...cfg.cardFields.map((f) => f.col)];
  return ids.some((id) => displayText(id, r).toLowerCase().includes(search));
}

/* ------------------------------------------------------------------ *
 * Rendu du board
 * ------------------------------------------------------------------ */
/* La forme d'affichage dépend du type du champ (pas de réglage) */
function formOf(c) {
  if (c.base === 'Date' || c.base === 'DateTime') return 'date';
  if (['Choice', 'ChoiceList', 'Ref', 'RefList'].includes(c.base)) return 'pastille';
  return 'texte';
}
/* Chaque champ s'affiche avec son titre (libellé de la colonne) au-dessus de sa valeur */
function fieldHtml(f, r) {
  const c = col(f.col); if (!c) return '';
  const vals = valueList(c, r[f.col]);
  if (!vals.length) return '';
  const form = formOf(c);
  let body;
  if (form === 'pastille') {
    body = `<div class="kb-badges">${vals.map((v) => { const k = badgeColor(c, v); return `<span class="kb-badge" style="background:${k.bg};color:${k.fg}">${esc(v)}</span>`; }).join('')}</div>`;
  } else if (form === 'date') {
    body = `<div class="kb-f-val"><span class="fr-icon-calendar-line fr-icon--sm" aria-hidden="true"></span> ${esc(vals.join(', '))}</div>`;
  } else {
    body = `<div class="kb-f-val">${esc(vals.join(', '))}</div>`;
  }
  return `<div class="kb-f"><div class="kb-f-label">${esc(c.label)}</div>${body}</div>`;
}
function cardHtml(r, d) {
  const title = displayText(cfg.titleCol, r) || 'Sans titre';
  const fields = cfg.cardFields.map((f) => fieldHtml(f, r)).filter(Boolean);
  return `<article class="kb-card" draggable="true" data-id="${r.id}" data-idx="${d.idx}">
    <h3 class="kb-card-title">${esc(title)}</h3>
    ${fields.length ? `<div class="kb-fields">${fields.join('')}</div>` : ''}
  </article>`;
}
function renderBoard() {
  const board = $('#kbBoard');
  $('#kbTitle').textContent = meta.tableId ? `Kanban · ${meta.tableId}` : 'Kanban';
  if (!meta.loaded) { board.innerHTML = '<div class="kb-empty">Chargement…</div>'; return; }
  if (!col(cfg.groupCol)) {
    board.innerHTML = `<div class="kb-empty"><p>Choisissez la colonne (liste de choix ou référence) qui définit les colonnes du kanban.</p>
      <button class="fr-btn" data-act="settings">Configurer</button></div>`;
    return;
  }
  const filtered = records.filter(matches);
  defsCache = groupDefs();
  board.innerHTML = defsCache.map((d) => {
    const cards = filtered.filter((r) => inColumn(r, d.key));
    if (d.key === null && !cards.length) return '';
    return `<section class="kb-col" style="--col-bar:${d.color.bar};--col-bg:${d.color.bg}" data-idx="${d.idx}">
      <div class="kb-col-head">
        <span class="kb-col-name" title="${esc(d.label)}">${esc(d.label)}</span>
        <span class="kb-count">${cards.length}</span>
      </div>
      <div class="kb-col-body" data-idx="${d.idx}">${cards.map((r) => cardHtml(r, d)).join('')}</div>
    </section>`;
  }).join('');
}

/* ------------------------------------------------------------------ *
 * Écriture dans Grist
 * ------------------------------------------------------------------ */
async function saveFields(id, fields) {
  const r = records.find((x) => x.id === id);
  if (r) Object.assign(r, fields);
  renderBoard();
  try { await grist.getTable().update({ id, fields }); }
  catch (e) { toast('Erreur d’enregistrement : ' + (e.message || e), true); }
}
function encodeGroup(gc, key) {
  if (gc.base === 'Choice') return key === null ? '' : key;
  if (gc.base === 'Ref') return key === null ? 0 : key;
  return key === null ? ['L'] : ['L', key];
}
function moveCard(id, fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  const gc = col(cfg.groupCol), r = records.find((x) => x.id === id); if (!gc || !r) return;
  const from = defsCache[fromIdx].key, to = defsCache[toIdx].key;
  let val;
  if (isListType(gc)) {
    const list = asList(r[gc.colId]).filter((v) => v !== from);
    if (to !== null && !list.includes(to)) list.push(to);
    val = ['L', ...list];
  } else val = encodeGroup(gc, to);
  saveFields(id, { [gc.colId]: val });
}

/* ------------------------------------------------------------------ *
 * Popup d'édition — la mise en page se modifie directement dans la popup
 *
 * cfg.modalFields est une liste plate de blocs :
 *   { col, w: 'full' | 'half' }      un champ (pas de "type")
 *   { type: 'heading', text }         un titre
 *   { type: 'divider' }               un séparateur
 *   { type: 'section', id, text }     une section : regroupe les blocs qui suivent, jusqu'à la section suivante
 * Le titre de la carte est modifiable en haut de la fenêtre.
 * ------------------------------------------------------------------ */
let editLayout = false;       // mode « Mise en page »
let draft = null;             // valeurs saisies mais pas encore enregistrées (conservées en entrant dans le mode mise en page)
let mdrag = null;             // glisser-déposer en cours dans la popup
const collapsed = new Set();  // sections repliées (mode lecture)
const uid = () => 's' + Math.random().toString(36).slice(2, 9);
const blocks = () => (cfg.modalFields = cfg.modalFields || []);
const isSection = (b) => !!b && b.type === 'section';
const secEnd = (s) => { const L = blocks(); let k = s + 1; while (k < L.length && !isSection(L[k])) k++; return k; };
const defaultWidth = (c) => (c && ['Text', 'ChoiceList', 'RefList'].includes(c.base) ? 'full' : 'half');

function editorHtml(c, raw, i, full, lock) {
  const id = 'f' + i, lab = `<label class="fr-label" for="${id}">${esc(c.label)}</label>`;
  const ro = c.readOnly || lock;
  const wrap = (inner) => `<div class="fr-input-group ${full ? 'kb-full' : ''}">${lab}${inner}</div>`;
  const checks = (items, sel) => `<div class="kb-checks" id="${id}">${items.map((it) =>
    `<label><input type="checkbox" value="${esc(it.v)}" ${sel.includes(it.v) ? 'checked' : ''} ${ro ? 'disabled' : ''}>${esc(it.l)}</label>`).join('')}</div>`;
  switch (c.base) {
    case 'Text':
      getters.push([c, () => $('#' + id).value]);
      return wrap(`<textarea class="fr-input" id="${id}" rows="3" ${ro ? 'disabled' : ''}>${esc(raw ?? '')}</textarea>`);
    case 'Numeric': case 'Int':
      getters.push([c, () => { const v = $('#' + id).value; return v === '' ? null : Number(v); }]);
      return wrap(`<input class="fr-input" id="${id}" type="number" step="${c.base === 'Int' ? 1 : 'any'}" value="${raw ?? ''}" ${ro ? 'disabled' : ''}>`);
    case 'Bool':
      getters.push([c, () => $('#' + id).checked]);
      return `<div class="fr-checkbox-group ${full ? 'kb-full' : ''}" style="margin-bottom:1rem"><input type="checkbox" id="${id}" ${raw ? 'checked' : ''} ${ro ? 'disabled' : ''}><label class="fr-label" for="${id}">${esc(c.label)}</label></div>`;
    case 'Date': {
      const s0 = toSec(raw);
      const v = s0 != null ? new Date(s0 * 1000).toISOString().slice(0, 10) : '';
      getters.push([c, () => { const s = $('#' + id).value; return s ? Date.parse(s + 'T00:00:00Z') / 1000 : null; }]);
      return wrap(`<input class="fr-input" id="${id}" type="date" value="${v}" ${ro ? 'disabled' : ''}>`);
    }
    case 'DateTime': {
      let v = '';
      if (toSec(raw) != null) { const d = new Date(toSec(raw) * 1000); v = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
      getters.push([c, () => { const s = $('#' + id).value; return s ? Date.parse(s) / 1000 : null; }]);
      return wrap(`<input class="fr-input" id="${id}" type="datetime-local" value="${v}" ${ro ? 'disabled' : ''}>`);
    }
    case 'Choice': {
      const ch = (c.opts && c.opts.choices) || [], cur = asList(raw)[0];
      const all = cur && !ch.includes(cur) ? [cur, ...ch] : ch;
      getters.push([c, () => $('#' + id).value]);
      return wrap(`<select class="fr-select" id="${id}" ${ro ? 'disabled' : ''}><option value="">—</option>${all.map((o) => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`);
    }
    case 'Ref': {
      const cur = asList(raw)[0], rows = refs[c.colId]?.rows || [];
      getters.push([c, () => Number($('#' + id).value) || 0]);
      return wrap(`<select class="fr-select" id="${id}" ${ro ? 'disabled' : ''}><option value="0">—</option>${rows.map((r) => `<option value="${r.id}" ${r.id === cur ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select>`);
    }
    case 'ChoiceList': {
      const items = ((c.opts && c.opts.choices) || []).map((v) => ({ v, l: v }));
      getters.push([c, () => ['L', ...[...$('#' + id).querySelectorAll('input:checked')].map((i) => i.value)]]);
      return wrap(checks(items, asList(raw)));
    }
    case 'RefList': {
      const items = (refs[c.colId]?.rows || []).map((r) => ({ v: r.id, l: r.label }));
      getters.push([c, () => ['L', ...[...$('#' + id).querySelectorAll('input:checked')].map((i) => Number(i.value))]]);
      return wrap(checks(items, asList(raw)));
    }
    default:
      return wrap(`<input class="fr-input" id="${id}" value="${esc(valueList(c, raw).join(', '))}" disabled>`);
  }
}

/* --- rendu des blocs --------------------------------------------------- */
function fieldBlockHtml(b, i, r) {
  const c = col(b.col);
  if (!c || b.col === cfg.titleCol) {
    return editLayout
      ? `<div class="fr-input-group kb-full"><p class="fr-hint-text">${c ? `« ${esc(c.label)} » est déjà utilisé comme titre.` : `Colonne introuvable : ${esc(b.col)}.`} Retirez ce bloc.</p></div>`
      : '';
  }
  const raw = draft && b.col in draft ? draft[b.col] : r[b.col];
  return editorHtml(c, raw, i, b.w === 'full', editLayout);
}
function barHtml(b, i, kind) {
  const w = !b.type ? `<button type="button" class="kb-mini" data-act="blkW" data-i="${i}" title="Changer la largeur">${b.w === 'full' ? 'Pleine largeur' : 'Demi-largeur'}</button>` : '';
  return `<div class="kb-blk-bar"><span class="kb-grip" title="Glisser pour déplacer" aria-label="Glisser pour déplacer">⠿</span>
    <span class="kb-blk-kind">${kind}</span>${w}
    <button type="button" class="kb-mini" data-act="blkRm" data-i="${i}" title="Retirer ce bloc">Retirer</button></div>`;
}
function blockHtml(b, i, r, sec) {
  let inner, full = true, kind;
  if (b.type === 'heading') {
    kind = 'Titre';
    inner = editLayout
      ? `<input class="fr-input kb-heading-input" data-blk="text" data-i="${i}" value="${esc(b.text || '')}" placeholder="Texte du titre" aria-label="Texte du titre">`
      : `<h3 class="kb-heading">${esc(b.text || '')}</h3>`;
  } else if (b.type === 'divider') {
    kind = 'Séparateur'; inner = '<hr class="kb-divider">';
  } else {
    kind = 'Champ'; full = b.w === 'full';
    inner = fieldBlockHtml(b, i, r);
    if (!inner) return '';
  }
  if (!editLayout) return b.type ? `<div class="kb-full">${inner}</div>` : inner;
  return `<div class="kb-blk ${full ? 'kb-full' : ''}" draggable="false" data-i="${i}" data-sec="${sec}">${barHtml(b, i, kind)}${inner}</div>`;
}
function sectionHtml(b, i, inner, endPos) {
  const key = b.id || ('s' + i);
  const shut = !editLayout && collapsed.has(key);
  if (!editLayout) {
    return `<section class="kb-section kb-full ${shut ? 'kb-collapsed' : ''}">
      <button type="button" class="kb-sec-toggle" data-act="toggleSec" data-key="${esc(key)}" aria-expanded="${!shut}"><span class="kb-chev">${shut ? '▸' : '▾'}</span> ${esc(b.text || 'Section')}</button>
      <div class="kb-sec-body">${inner}</div></section>`;
  }
  return `<section class="kb-section kb-blk kb-full" draggable="false" data-i="${i}" data-sec="${i}">
    <div class="kb-blk-bar"><span class="kb-grip" title="Glisser pour déplacer la section" aria-label="Glisser pour déplacer la section">⠿</span>
      <span class="kb-blk-kind">Section</span>
      <button type="button" class="kb-mini" data-act="blkRm" data-i="${i}" title="Retirer la section (ses champs sont conservés)">Retirer la section</button></div>
    <input class="fr-input kb-sec-input" data-blk="text" data-i="${i}" value="${esc(b.text || '')}" placeholder="Titre de la section" aria-label="Titre de la section">
    <div class="kb-sec-body">${inner}<div class="kb-dropzone kb-full" data-pos="${endPos}">Déposez ici</div></div></section>`;
}
function bodyHtml(r) {
  const L = blocks();
  let out = '', k = 0;
  while (k < L.length && !isSection(L[k])) { out += blockHtml(L[k], k, r, -1); k++; }
  while (k < L.length) {
    const s = k, e = secEnd(s);
    let inner = '';
    for (let j = s + 1; j < e; j++) inner += blockHtml(L[j], j, r, s);
    out += sectionHtml(L[s], s, inner, e);
    k = e;
  }
  if (editLayout) out += `<div class="kb-dropzone kb-full" data-pos="${L.length}">Déposez ici pour ajouter à la fin</div>`;
  else if (!out.trim()) out = '<p class="fr-hint-text kb-full">Aucun champ. Cliquez sur « Mise en page » pour en ajouter.</p>';
  return out;
}
function paletteHtml() {
  const used = new Set(blocks().filter((b) => !b.type).map((b) => b.col));
  const free = meta.cols.filter((c) => c.colId !== cfg.titleCol && !used.has(c.colId));
  const chip = (spec, label, cls) => `<button type="button" class="kb-chip ${cls || ''}" draggable="true" data-act="addBlk" data-spec="${esc(JSON.stringify(spec))}">${label}</button>`;
  return `<div class="kb-palette">
    <span class="kb-pal-label">Éléments :</span>
    ${chip({ type: 'heading' }, 'Titre', 'kb-chip-el')}${chip({ type: 'section' }, 'Section', 'kb-chip-el')}${chip({ type: 'divider' }, 'Séparateur', 'kb-chip-el')}
    <span class="kb-pal-label">Champs :</span>
    ${free.length ? free.map((c) => chip({ col: c.colId }, esc(c.label))).join('') : '<span class="fr-hint-text">Tous les champs sont placés.</span>'}
    <span class="kb-pal-hint">Glissez un élément dans la fenêtre, ou cliquez pour l’ajouter à la fin.</span></div>`;
}

/* --- fenêtre ------------------------------------------------------------ */
function renderModal() {
  const r = records.find((x) => x.id === modalId); if (!r) return;
  getters = [];
  const ov = $('#kbOverlay');
  const prev = ov.querySelector('.kb-modal-body');
  const scroll = prev ? prev.scrollTop : 0;
  const tc = col(cfg.titleCol);
  let head;
  if (tc && tc.base === 'Text' && !tc.readOnly) {
    getters.push([tc, () => $('#kbModalTitle').value]);
    const v = draft && tc.colId in draft ? draft[tc.colId] : (r[cfg.titleCol] ?? '');
    head = `<input class="fr-input" id="kbModalTitle" aria-label="${esc(tc.label)}" value="${esc(v)}" ${editLayout ? 'disabled' : ''}>`;
  } else head = `<h2 id="kbModalTitle">${esc(displayText(cfg.titleCol, r) || 'Sans titre')}</h2>`;
  const body = bodyHtml(r);
  ov.innerHTML = `<div class="kb-modal ${editLayout ? 'kb-editing' : ''}" role="dialog" aria-modal="true" aria-labelledby="kbModalTitle">
    <div class="kb-modal-head">${head}
      ${editLayout ? '' : '<button class="fr-btn fr-btn--tertiary fr-btn--sm fr-icon-edit-line fr-btn--icon-left" data-act="editLayout">Mise en page</button>'}
      <button class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-close-line" data-act="close" title="Fermer">Fermer</button></div>
    ${editLayout ? paletteHtml() : ''}
    <div class="kb-modal-body">${body}</div>
    <div class="kb-modal-foot">
      ${editLayout
        ? '<button class="fr-btn" data-act="doneLayout">Terminer la mise en page</button>'
        : '<button class="fr-btn fr-btn--secondary" data-act="close">Annuler</button><button class="fr-btn" data-act="save">Enregistrer</button>'}
    </div></div>`;
  ov.classList.add('open');
  const nb = ov.querySelector('.kb-modal-body'); if (nb) nb.scrollTop = scroll;
}
function openModal(id) {
  if (!records.some((x) => x.id === id)) return;
  modalId = id; editLayout = false; draft = null;
  renderModal();
}
function closeModal() { $('#kbOverlay').classList.remove('open'); modalId = null; getters = []; editLayout = false; draft = null; mdrag = null; }
async function saveModal() {
  const r = records.find((x) => x.id === modalId); if (!r) return closeModal();
  const fields = {};
  getters.forEach(([c, get]) => {
    if (c.readOnly) return;
    const nv = get();
    const old = isListType(c) ? ['L', ...asList(r[c.colId])]
      : (c.base === 'Date' || c.base === 'DateTime') ? toSec(r[c.colId]) : r[c.colId];
    if (JSON.stringify(nv) !== JSON.stringify(old ?? (typeof nv === 'string' ? '' : old))) fields[c.colId] = nv;
  });
  const id = modalId; closeModal();
  if (Object.keys(fields).length) { await saveFields(id, fields); toast('Carte enregistrée'); }
}

/* --- modifications de la mise en page --------------------------------- */
function enterLayout() {
  draft = {};
  getters.forEach(([c, get]) => { if (!c.readOnly) { try { draft[c.colId] = get(); } catch (e) {} } });
  editLayout = true; renderModal();
}
function saveLayout() { saveCfg(); renderModal(); }
function newBlock(spec) {
  if (spec.type === 'heading') return { type: 'heading', text: 'Nouveau titre' };
  if (spec.type === 'section') return { type: 'section', id: uid(), text: 'Nouvelle section' };
  if (spec.type === 'divider') return { type: 'divider' };
  return { col: spec.col, w: defaultWidth(col(spec.col)) };
}
/* Où tomberait l'élément glissé ? → { pos, el, side } ou null */
function dropTarget(e) {
  const L = blocks();
  const z = e.target.closest && e.target.closest('.kb-dropzone');
  if (z) return { pos: Number(z.dataset.pos), el: z, side: 'over' };
  const el = e.target.closest && e.target.closest('.kb-blk');
  if (!el) return null;
  const i = Number(el.dataset.i), b = L[i], r = el.getBoundingClientRect();
  if (mdrag.kind === 'section') {              // une section ne se pose qu'entre deux sections
    const s = isSection(b) ? i : Number(el.dataset.sec);
    if (s < 0) return null;
    const secEl = el.closest('.kb-section'), sr = secEl.getBoundingClientRect();
    return e.clientY > sr.top + sr.height / 2
      ? { pos: secEnd(s), el: secEl, side: 'after' }
      : { pos: s, el: secEl, side: 'before' };
  }
  if (isSection(b)) {                          // sur l'en-tête d'une section : juste avant, ou en tête de section
    return e.clientY < r.top + 14 ? { pos: i, el, side: 'before' } : { pos: i + 1, el, side: 'over' };
  }
  const half = !b.type && b.w !== 'full';
  const after = half ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
  return { pos: i + (after ? 1 : 0), el, side: half ? (after ? 'right' : 'left') : (after ? 'after' : 'before') };
}
function validPos(pos) {
  if (mdrag.kind !== 'section') return true;
  const L = blocks();
  return (pos === L.length || isSection(L[pos])) && !(pos >= mdrag.from && pos <= mdrag.to);
}
function applyDrop(m) {
  const L = blocks();
  if (m.kind === 'new') L.splice(m.pos, 0, newBlock(m.spec));
  else if (m.kind === 'block') {
    let to = m.pos; if (m.from < to) to--;
    if (to === m.from) return;
    const [it] = L.splice(m.from, 1); L.splice(to, 0, it);
  } else {
    const n = m.to - m.from, chunk = L.splice(m.from, n);
    let to = m.pos; if (to > m.from) to -= n;
    L.splice(to, 0, ...chunk);
  }
  saveLayout();
}

/* ------------------------------------------------------------------ *
 * Panneau de configuration
 * ------------------------------------------------------------------ */
/* On mémorise ce qu'on envoie à Grist pour ignorer son « écho » dans onOptions (sinon une réponse tardive
   pourrait écraser une modification plus récente faite entre-temps). */
const sentCfg = [];
function saveCfg() {
  sentCfg.push(JSON.stringify(cfg)); if (sentCfg.length > 12) sentCfg.shift();
  grist.setOptions({ cfg });
}
function persist() { saveCfg(); renderBoard(); renderDrawer(); }
function renderDrawer() {
  const d = $('#kbDrawer');
  if (!meta.loaded) { d.innerHTML = ''; return; }
  const opt = (arr, sel) => arr.map((c) => `<option value="${esc(c.colId)}" ${c.colId === sel ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  const groupable = meta.cols.filter((c) => GROUP_TYPES.includes(c.base));
  const freeCard = meta.cols.filter((c) => c.colId !== cfg.titleCol && !cfg.cardFields.some((f) => f.col === c.colId));
  const rows = (name, list) => list.map((f, i) => `<div class="kb-row" draggable="false" data-list="${name}" data-i="${i}">
        <span class="kb-grip" title="Glisser pour réordonner" aria-label="Glisser pour réordonner">⠿</span>
        <span class="kb-row-name">${esc(col(f.col)?.label || f.col)}</span>
        <button class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-delete-line" data-act="rm" data-list="${name}" data-i="${i}" title="Retirer">Retirer</button></div>`).join('');
  d.innerHTML = `
    <section style="display:flex;align-items:center;gap:.5rem"><h3 style="flex:1;margin:0">Configuration du kanban</h3>
      <button class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-close-line" data-act="closeSettings" title="Fermer">Fermer</button></section>
    <section><h3>Colonnes du kanban</h3>
      <select class="fr-select" data-cfg="groupCol"><option value="">— Choisir —</option>${opt(groupable, cfg.groupCol)}</select>
      <p class="fr-hint-text" style="margin-top:.5rem">Liste de choix ou référence.</p></section>
    <section><h3>Titre de la carte</h3>
      <select class="fr-select" data-cfg="titleCol">${opt(meta.cols, cfg.titleCol)}</select></section>
    <section><h3>Champs sous le titre</h3>
      ${rows('card', cfg.cardFields)}
      <select class="fr-select" data-cfg="addCard" aria-label="Ajouter un champ à la carte"><option value="">+ Ajouter un champ…</option>${opt(freeCard, '')}</select>
      <p class="fr-hint-text" style="margin-top:.5rem">Glissez la poignée ⠿ pour réordonner. L’affichage suit le type du champ : pastille pour les choix et références, icône pour les dates, texte sinon. Le titre du champ s’affiche au-dessus de sa valeur.</p></section>
    <section><h3>Fenêtre de détail</h3>
      <p class="fr-hint-text">La mise en page (champs, titres, sections, séparateurs, largeurs) se règle directement dans la fenêtre : cliquez sur une carte, puis sur « Mise en page ».</p></section>`;
}
function openSettings() { renderDrawer(); $('#kbDrawer').classList.add('open'); }

/* ------------------------------------------------------------------ *
 * Événements
 * ------------------------------------------------------------------ */
document.addEventListener('click', async (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) {
    const card = e.target.closest('.kb-card');
    if (card) openModal(Number(card.dataset.id));
    else if (e.target === $('#kbOverlay')) closeModal();
    return;
  }
  const i = Number(a.dataset.i), idx = Number(a.dataset.idx);
  switch (a.dataset.act) {
    case 'settings': openSettings(); break;
    case 'closeSettings': $('#kbDrawer').classList.remove('open'); break;
    case 'close': closeModal(); break;
    case 'save': saveModal(); break;
    case 'refresh': await loadMeta(); normRecords(); renderBoard(); renderDrawer(); toast('Structure rechargée'); break;
    case 'rm': cfg.cardFields.splice(i, 1); persist(); break;
    /* popup : mode mise en page */
    case 'editLayout': enterLayout(); break;
    case 'doneLayout': editLayout = false; renderModal(); break;
    case 'toggleSec': { const k = a.dataset.key; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); renderModal(); break; }
    case 'blkW': { const b = blocks()[i]; if (b) { b.w = b.w === 'full' ? 'half' : 'full'; saveLayout(); } break; }
    case 'blkRm': blocks().splice(i, 1); saveLayout(); break;
    case 'addBlk': { let spec; try { spec = JSON.parse(a.dataset.spec); } catch (x) { break; } blocks().push(newBlock(spec)); saveLayout(); break; }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.blk === 'text') {          // texte d'un titre / d'une section (popup) : pas de nouveau rendu, on garde le focus
    const b = blocks()[Number(t.dataset.i)];
    if (b) { b.text = t.value; saveCfg(); }
    return;
  }
  const k = t.dataset && t.dataset.cfg; if (!k) return;
  if (k === 'groupCol') cfg.groupCol = t.value || null;
  else if (k === 'titleCol') cfg.titleCol = t.value;
  else if (k === 'addCard') { if (t.value) cfg.cardFields.push({ col: t.value }); }
  persist();
});
$('#kbSearch').addEventListener('input', (e) => { search = e.target.value.trim().toLowerCase(); renderBoard(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); $('#kbDrawer').classList.remove('open'); } });

/* Réordonnancement des champs (panneau de configuration) : on ne peut saisir une ligne que par sa poignée */
let rdrag = null;   // { list: 'card' | 'modal', i, target?: { i, after } }
const MARKS = ['row-dragging', 'drop-before', 'drop-after', 'drop-left', 'drop-right', 'drop-over'];
const clearRowMarks = () => document.querySelectorAll(MARKS.map((m) => '.' + m).join(',')).forEach((n) => n.classList.remove(...MARKS));
const resetGrips = () => document.querySelectorAll('.kb-row[draggable=true],.kb-blk[draggable=true]').forEach((n) => (n.draggable = false));
document.addEventListener('mousedown', (e) => {
  const g = e.target.closest && e.target.closest('.kb-grip');
  const host = g && g.closest('.kb-row, .kb-blk');
  if (host) host.draggable = true;
});
document.addEventListener('mouseup', resetGrips);
document.addEventListener('dragstart', (e) => {
  /* popup : élément de la palette ou bloc saisi par sa poignée */
  const chip = e.target.closest && e.target.closest('.kb-chip');
  const blk = !chip && e.target.closest && e.target.closest('.kb-blk');
  if (chip || blk) {
    if (chip) { try { mdrag = { kind: 'new', spec: JSON.parse(chip.dataset.spec) }; } catch (x) { return; } }
    else {
      const i = Number(blk.dataset.i), b = blocks()[i];
      mdrag = isSection(b) ? { kind: 'section', from: i, to: secEnd(i) } : { kind: 'block', from: i };
      blk.classList.add('row-dragging');
    }
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'bloc'); } catch (x) {}
    return;
  }
  const row = e.target.closest && e.target.closest('.kb-row');
  if (row) {
    rdrag = { list: row.dataset.list, i: Number(row.dataset.i) };
    row.classList.add('row-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'field'); } catch (x) {}
    return;
  }
  const card = e.target.closest && e.target.closest('.kb-card'); if (!card) return;
  drag = { id: Number(card.dataset.id), from: Number(card.dataset.idx) };
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(drag.id)); } catch (x) {}
});
document.addEventListener('dragend', () => {
  drag = null; rdrag = null; mdrag = null; clearRowMarks(); resetGrips();
  document.querySelectorAll('.dragging,.drag-over').forEach((n) => n.classList.remove('dragging', 'drag-over'));
});
document.addEventListener('dragover', (e) => {
  if (mdrag) {
    const t = dropTarget(e);
    const keep = mdrag.kind === 'block' || mdrag.kind === 'section' ? document.querySelector('.kb-blk.row-dragging') : null;
    clearRowMarks(); if (keep) keep.classList.add('row-dragging');
    mdrag.pos = undefined;
    if (!t || !validPos(t.pos)) return;
    e.preventDefault();
    mdrag.pos = t.pos;
    t.el.classList.add(({ before: 'drop-before', after: 'drop-after', left: 'drop-left', right: 'drop-right', over: 'drop-over' })[t.side]);
    return;
  }
  if (rdrag) {
    const row = e.target.closest && e.target.closest('.kb-row');
    if (!row || row.dataset.list !== rdrag.list) return;
    e.preventDefault();
    const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    clearRowMarks();
    document.querySelectorAll('.kb-row').forEach((n) => { if (n.dataset.list === rdrag.list && Number(n.dataset.i) === rdrag.i) n.classList.add('row-dragging'); });
    row.classList.add(after ? 'drop-after' : 'drop-before');
    rdrag.target = { i: Number(row.dataset.i), after };
    return;
  }
  const body = e.target.closest && e.target.closest('.kb-col'); if (!body || !drag) return;
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach((n) => n.classList.remove('drag-over'));
  body.querySelector('.kb-col-body').classList.add('drag-over');
});
document.addEventListener('drop', (e) => {
  if (mdrag) {
    e.preventDefault();
    const m = mdrag; mdrag = null; clearRowMarks(); resetGrips();
    if (m.pos !== undefined) applyDrop(m);
    return;
  }
  if (rdrag) {
    e.preventDefault();
    const { list: name, i: from, target } = rdrag;
    rdrag = null; clearRowMarks();
    const list = name === 'modal' ? cfg.modalFields : cfg.cardFields;
    if (!list || !target) return;
    let to = target.i + (target.after ? 1 : 0);
    if (from < to) to--;
    if (to !== from) { const [it] = list.splice(from, 1); list.splice(to, 0, it); persist(); }
    return;
  }
  const colEl = e.target.closest && e.target.closest('.kb-col'); if (!colEl || !drag) return;
  e.preventDefault();
  const { id, from } = drag; drag = null;
  moveCard(id, from, Number(colEl.dataset.idx));
});

/* ------------------------------------------------------------------ *
 * Démarrage
 * ------------------------------------------------------------------ */
/* Par défaut Grist renvoie le libellé des références, pas leur identifiant : on demande les identifiants
   (expandRefs: false) et, par sécurité, on retraduit un éventuel libellé en identifiant. */
function refIdOf(c, v) {
  if (Array.isArray(v) && v[0] === 'R') v = v[2];        // forme codée ['R', table, identifiant ou libellé]
  if (typeof v === 'number' || v == null || v === '') return v;
  const hit = (refs[c.colId]?.rows || []).find((x) => x.label === v);
  return hit ? hit.id : v;
}
function normRecords() {
  const rc = meta.cols.filter((c) => c.base === 'Ref' || c.base === 'RefList');
  if (!rc.length) return;
  records.forEach((r) => rc.forEach((c) => {
    const v = r[c.colId];
    if (c.base === 'Ref') r[c.colId] = refIdOf(c, v);
    else if (Array.isArray(v)) r[c.colId] = ['L', ...asList(v).map((x) => refIdOf(c, x))];
  }));
}

grist.ready({ requiredAccess: 'full', onEditOptions: openSettings });
grist.onOptions((o) => {
  const c = (o && o.cfg) || {};
  if (sentCfg.includes(JSON.stringify(c))) return;       // écho de notre propre enregistrement
  cfg = { groupCol: c.groupCol || cfg.groupCol, titleCol: c.titleCol || cfg.titleCol, cardFields: c.cardFields || cfg.cardFields,
          modalFields: c.modalFields || cfg.modalFields };
  renderBoard();
});
/* onRecords sert à savoir QUELLES lignes afficher (filtres, liens entre widgets) et à être prévenu des changements.
   Les valeurs, elles, sont relues en brut (identifiants, dates en nombre, listes ['L', …]) : c'est le seul format
   fiable, quelle que soit la version de Grist. */
let loadSeq = 0;
async function loadRecords(rows) {
  const seq = ++loadSeq;
  let raw = null;
  try { raw = await grist.docApi.fetchTable(meta.tableId || await grist.getTable().getTableId()); } catch (e) {}
  if (seq !== loadSeq) return;                           // une mise à jour plus récente est arrivée entre-temps
  if (raw && Array.isArray(raw.id)) {
    const idx = new Map(raw.id.map((id, i) => [id, i]));
    const keys = Object.keys(raw).filter((k) => k !== 'id');
    records = rows.map((row) => {
      const i = idx.get(row.id);
      if (i === undefined) return row;
      const rec = { id: row.id };
      keys.forEach((k) => { rec[k] = raw[k][i]; });
      return rec;
    });
  } else records = rows;
  normRecords();
  renderBoard();
  if (modalId !== null && !records.some((r) => r.id === modalId)) closeModal();
}
grist.onRecords((rows) => { loadRecords(rows); }, { includeColumns: 'shown', keepEncoded: true, expandRefs: false, format: 'rows' });
renderBoard();
loadMeta().then(() => {
  if (!cfg.cardFields.length) {
    cfg.cardFields = meta.cols.filter((c) => c.colId !== cfg.titleCol && c.colId !== cfg.groupCol && ['Date', 'Choice', 'Ref'].includes(c.base)).slice(0, 3)
      .map((c) => ({ col: c.colId }));
  }
  if (!cfg.modalFields) cfg.modalFields = cfg.cardFields.map((f) => ({ col: f.col, w: defaultWidth(col(f.col)) }));
  normRecords();
  renderBoard(); renderDrawer();
}).catch((e) => { $('#kbBoard').innerHTML = `<div class="kb-empty"><p>Impossible de lire la structure de la table.</p><p class="fr-hint-text">${esc(e.message || e)}<br>Vérifiez que le widget a l’accès « Accès complet au document ».</p></div>`; });
</script>
</body>
